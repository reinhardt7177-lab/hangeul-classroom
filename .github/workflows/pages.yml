name: Verify and deploy classroom
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('classroom-pr-{0}', github.event.number) || 'classroom-pages' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify presentation and audio controls
        run: |
          node site/verify-presenter.mjs
          node site/verify-documentary-audio.mjs
      - name: Verify lesson content and worksheets
        working-directory: site
        run: |
          node verify.mjs
          node verify-gaecheon.mjs
          node verify-samil.mjs
          node verify-renewal.mjs
          node verify-images.mjs
      - name: Prepare classroom files
        run: node site/package.mjs
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: output/hangeul/수업앱

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
